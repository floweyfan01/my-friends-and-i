<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My friends and I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&family=Playfair+Display:wght@700;800&family=Bungee&family=DotGothic16&family=Rye&family=UnifrakturCook:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F2;--papel:#fff;--tinta:#241F3A;--a:#B79CFF;--b:#FFC93C;--c:#FFE9A8;--f:"Pixelify Sans",Verdana,sans-serif;--r:0px;--sh:5px 5px 0 var(--b);--tilt:0deg;--pat:none;--sz:28px 28px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-wrap:break-word;color:var(--tinta);font:15px/1.65 Verdana,Tahoma,Geneva,sans-serif;background-color:var(--bg);background-image:var(--pat);background-size:var(--sz)}
h1,h2,h3,.f{font-family:var(--f);font-weight:700;margin:0;line-height:1.15}
a{color:inherit}
a:focus-visible,button:focus-visible,label:focus-within,input:focus-visible,textarea:focus-visible{outline:3px dashed var(--tinta);outline-offset:3px}
.pagina{max-width:1000px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) 34px max(14px,env(safe-area-inset-left));overflow-x:clip}
.banner{text-align:center}
.marca{display:inline-block;text-decoration:none;font-size:clamp(2rem,7vw,3.4rem);text-shadow:3px 3px 0 var(--b),6px 6px 0 var(--c)}
.banner small{display:block;margin-top:10px;opacity:.85}
.faixa{border:3px solid var(--a);background:var(--c);overflow:hidden;white-space:nowrap;margin-top:14px;font-weight:700;font-size:.85rem;border-radius:var(--r)}
.faixa span{display:inline-block;padding:3px 0 3px 100%;animation:corre 26s linear infinite}
@keyframes corre{to{transform:translateX(-100%)}}
@keyframes sobe{to{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.faixa span{animation:none;padding-left:12px}.card{transition:none}.brilho{display:none}}
.topnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 24px}
.topnav a{background:var(--k);border:2px solid var(--kb);border-radius:999px;padding:2px 14px;text-decoration:none;color:#241F3A;font-weight:700;font-size:.9rem}
.topnav a[aria-current="page"]{background:#241F3A;color:#fff;border-color:#241F3A}
.caixa{background:var(--papel);border:3px solid var(--a);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;margin-bottom:22px}
.caixa h2{font-size:1.15rem;margin-bottom:10px}
.tres{display:grid;grid-template-columns:210px minmax(0,1fr) 210px;gap:0 22px;align-items:start}
.centro>.caixa:nth-child(odd){transform:rotate(var(--tilt))}
.centro>.caixa:nth-child(even){transform:rotate(calc(var(--tilt)*-1))}
.orn{overflow:hidden;white-space:nowrap;text-align:center;color:var(--a);letter-spacing:.35em;margin:12px 0;line-height:1}
.foto{position:relative;background:var(--c);overflow:hidden;color:var(--tinta);display:grid;place-items:center;text-align:center}
.foto{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 8px,transparent 8px 16px)}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .vazio{padding:14px;font-weight:700;font-size:.8rem}
.foto input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.polaroid{position:relative;margin:10px 0 0;background:#fff;border:3px solid var(--a);padding:8px 8px 22px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--b)}
.polaroid::before{content:"";position:absolute;top:-14px;left:50%;width:80px;height:24px;margin-left:-40px;background:var(--b);opacity:.8;transform:rotate(3deg);z-index:1}
.polaroid .foto{aspect-ratio:4/5}
.nomeh{font-size:2.2rem;text-align:center;text-shadow:2px 2px 0 var(--b);margin-top:14px}
.info{font-size:.85rem;margin:0}
.rm{background:none;border:0;color:inherit;opacity:.7;font:inherit;font-size:.75rem;text-decoration:underline;cursor:pointer;padding:8px 0}
.bt{display:block;width:100%;text-align:left;font:700 .95rem var(--f);background:linear-gradient(var(--papel),var(--c));color:var(--tinta);border:3px solid var(--a);border-radius:var(--r);padding:7px 12px;margin-bottom:10px;cursor:pointer}
.bt:hover{background:var(--c)}
.bt[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.mascote{display:block;width:100%;background:none;border:0;color:var(--tinta);font:700 1.1rem/1.25 monospace;white-space:pre;text-align:center;cursor:pointer;padding:8px 0}
.fala{background:var(--c);border:2px solid var(--a);border-radius:var(--r);padding:6px 10px;font-size:.82rem}
.hello{font:800 clamp(2.4rem,8vw,3.6rem)/1 var(--f);text-shadow:2px 2px 0 var(--b),4px 4px 0 var(--c)}
.frase{margin:18px 0 0;padding:12px 16px;border:3px dashed var(--a);background:var(--c);font:700 1.1rem/1.35 var(--f)}
.num{font:700 1.2rem var(--f);letter-spacing:4px;background:var(--tinta);color:var(--papel);padding:0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{border:2px dashed var(--a);background:var(--c);border-radius:var(--r);padding:1px 10px}
.texto{margin:0;white-space:pre-line;max-width:68ch}
.lista{margin:0;padding-left:20px}
.ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 22px;margin:0}
.ficha div{border-bottom:2px dotted var(--a);padding-bottom:6px}
.ficha dt{font-size:.8rem;opacity:.75}
.ficha dd{margin:0;font-weight:700}
.rels,.gb{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.rels li{display:grid;grid-template-columns:56px 1fr;gap:14px;border-bottom:2px dotted var(--a);padding-bottom:14px}
.rels li:last-child{border:0;padding:0}
.av{width:56px;height:56px;border:3px solid var(--a);border-radius:var(--r);display:grid;place-items:center;font:700 1.6rem var(--f);background:var(--cc)}
.tag{display:inline-block;margin-left:8px;border:2px solid var(--a);background:var(--b);padding:0 8px;font-size:.75rem;font-weight:700}
.rels p{margin:4px 0 0}
.gb li{border-bottom:2px dotted var(--a);padding-bottom:10px}
.gl{display:block;margin:10px 0;font-size:.85rem}
.gl input,.gl textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:8px;border:2px solid var(--a);border-radius:var(--r);background:#fff;color:var(--tinta)}
.brilho{position:fixed;pointer-events:none;z-index:50;color:var(--a);font-size:1.4rem;text-shadow:1px 1px 0 var(--papel);animation:sobe .8s ease-out forwards}
.boas h2{font-size:clamp(1.8rem,6vw,2.8rem)}
.boas p{max-width:56ch;margin:10px 0 0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px}
.card{display:block;text-decoration:none;background:var(--papel);border:3px solid var(--a);border-radius:var(--r);padding:10px 10px 12px;box-shadow:var(--sh);transition:transform .12s}
.card:nth-child(odd){transform:rotate(-1deg)}
.card:nth-child(even){transform:rotate(1deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.card .foto{aspect-ratio:1/1;border:2px solid var(--a);border-radius:var(--r)}
.card .foto{background-image:var(--pat);background-size:var(--sz)}
.card h2{font-size:1.4rem;margin-top:10px}
.card p{margin:2px 0 0;font-size:.8rem;line-height:1.35;opacity:.8}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;font-weight:700;padding:8px 14px;background:var(--papel);border:3px solid var(--a);border-radius:var(--r);box-shadow:3px 3px 0 var(--b)}
.rodape{text-align:center;font-size:.8rem;margin-top:14px;padding-top:14px;border-top:3px dotted var(--a)}
@media (max-width:860px){.tres{grid-template-columns:1fr}.esq{order:1}.dir{order:2}.centro{order:3;scroll-margin-top:12px}.polaroid{max-width:240px;margin-left:auto;margin-right:auto}.abas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}.abas .bt{margin:0}}
@media (max-width:560px){body{font-size:16px}.topnav a{padding:6px 14px}.grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:8px}.card h2{font-size:1.1rem}.btn{flex:1 1 100%;text-align:center}}
.caixa,.card,.btn,.faixa{color:var(--tinta)}
.aviso{border:2px dashed var(--b);padding:6px 10px;font-size:.85rem;margin:0 0 12px}
.onda{display:block;width:100%;margin-bottom:12px;border:3px inset #4E6B3A;border-radius:6px}

html[data-t=p2] :focus-visible{outline-color:var(--b)}

html[data-t=p2] .frase{font-size:1.5rem}
html[data-t=p2] .fala{font-size:1.15rem}
html[data-t=p2] .hello{font-size:4rem}

html[data-t=p2] .polaroid::before{top:-32px;width:50px;height:36px;margin-left:-25px;background:none;border:4px solid #6B7B5A;border-bottom:0;border-radius:28px 28px 0 0;opacity:1;transform:none}
.langbtn{display:block;margin:0 0 10px auto;background:var(--c);color:var(--tinta);border:2px solid var(--a);border-radius:999px;padding:6px 14px;font:700 .85rem Verdana,Tahoma,sans-serif;cursor:pointer}
.foto.chibi img{object-fit:contain;object-position:center bottom;inset:auto;left:6%;bottom:0;width:88%;height:94%}

.rn span{display:inline-block;padding:0 .12em;margin:0 .03em}
.rn span:nth-child(4n+1){background:#fff;color:#111;transform:rotate(-3deg)}
.rn span:nth-child(4n+2){background:#C8102E;color:#fff;transform:rotate(2deg);font-family:"Special Elite",serif}
.rn span:nth-child(4n+3){background:#E6B422;color:#111;transform:rotate(-1deg);font-family:Georgia,serif}
.rn span:nth-child(4n){background:#111;color:#fff;outline:2px solid #fff;transform:rotate(3deg);font-family:Impact,sans-serif}
html[data-t=p1] .marca{font-size:clamp(1.8rem,6vw,3rem);text-shadow:3px 3px 0 var(--b),6px 6px 0 var(--a)}
html[data-t=p1] .faixa{background:linear-gradient(#FF5A6E 0 34%,#FF7A4D 34% 67%,#FF9F1C 67%);border-color:var(--tinta);font-weight:800}
html[data-t=p1] .caixa{border:3px solid var(--tinta)}
html[data-t=p1] .caixa>h2{margin:-14px -16px 12px;padding:4px 14px;background:linear-gradient(90deg,var(--a),var(--b));border-bottom:3px solid var(--tinta);font-size:1.05rem;letter-spacing:.04em;display:flex;justify-content:space-between}
html[data-t=p1] .caixa>h2::after{content:"▲ ●";font-size:.8rem}
html[data-t=p1] .bt{background:linear-gradient(90deg,var(--c),#FFD9A8);border:3px solid var(--tinta);border-radius:0;box-shadow:3px 3px 0 var(--b);font-size:.9rem;transform:skewX(-6deg)}
html[data-t=p1] .bt[aria-pressed="true"]{background:var(--tinta);color:#FFE14D}
html[data-t=p1] .frase{background:#FFE14D;border:3px solid var(--tinta);font-size:.95rem}
html[data-t=p1] .chips li{border:2px solid var(--tinta);background:var(--c)}
html[data-t=p1] .chips li:nth-child(even){background:#FFE14D}
html[data-t=p3] .caixa{border:3px double var(--a)}
html[data-t=p3] .caixa>h2{margin:-14px -16px 12px;padding:4px 14px;background:linear-gradient(#C45A96 0 50%,#A83A78 50%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);font-size:1.1rem;display:flex;justify-content:space-between}
html[data-t=p3] .caixa>h2::after{content:"☆彡";font-size:.9rem}
html[data-t=p3] .bt{border-radius:999px;border:2px solid #E0B94A;background:linear-gradient(#FFF7CC 0 50%,#FFE27A 50%);box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(120,80,0,.25);font-size:.95rem}
html[data-t=p3] .bt[aria-pressed="true"]{background:linear-gradient(#B8478A 0 50%,#A83A78 50%);border-color:#7A2A59;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
html[data-t=p3] .chips li{border:2px dotted var(--a);border-radius:999px;background:#FFF7CC}
html[data-t=p3] .frase{border:3px double var(--a);background:#FFF7CC;font-size:1.05rem}
html[data-t=p4] body{background-attachment:fixed}

html[data-t=p4] .caixa>h2{text-shadow:0 0 12px rgba(183,166,232,.95)}

<body>
<div class="pagina">
<header class="banner"><button type="button" class="langbtn" id="lang" data-lang></button><a class="marca f" href="#inicio" id="marca"></a><small id="sub"></small>

let aba='oi',fi=0,pag='';
function tema(k){const t=TEMAS[k]||TEMAS.home,s=document.documentElement.style;document.documentElement.dataset.t=k;
 [['--bg',t.bg],['--papel',t.papel],['--tinta',t.tinta],['--a',t.a],['--b',t.b],['--c',t.c],['--f',t.f+','+(t.ff||'Verdana,sans-serif')],['--r',t.r],['--sh',t.sh],['--tilt',t.tilt],['--pat',t.pat],['--sz',t.sz]].forEach(v=>s.setProperty(v[0],v[1]))}
const orn=d=>'<div class="orn" aria-hidden="true">'+d.repeat(40)+'</div>';
const chips=a=>'<ul class="chips">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const caixa=(t,c)=>'<section class="caixa"><h2>'+esc(t)+'</h2>'+c+'</section>';
function gbLer(id){try{return JSON.parse(localStorage.getItem('gb:'+id))||[]}catch(e){return []}}
function foto(p,ed){
  const src=fonte(p),ch=src===p.imagem;
  const c=src?'<img src="'+esc(src)+'" alt="'+u('alt')+esc(p.nome)+'">':'<span class="vazio">'+(ed?u('addImg')+esc(p.nome):u('soon'))+'</span>';
  const inp=ed?'<input type="file" accept="image/*" data-id="'+p.id+'" aria-label="'+u('addAria')+esc(p.nome)+'">':'';
  return '<div class="foto'+(src?' tem':'')+(ch?' chibi':'')+'" style="--c:'+p.cor+'">'+c+inp+'</div>';
}
function home(){
  document.title=u('site');
  $('#app').innerHTML='<section class="caixa boas"><h2>'+u('hT')+'</h2><p>'+u('hS')+'</p></section><div class="grade">'+
  PERSONAGENS.map(p0=>{const p=D(p0),t=TEMAS[p.id];return '<a class="card" href="#'+p.id+'" style="--a:'+t.a+';--b:'+t.b+';--papel:'+t.papel+';--tinta:'+t.tinta+';--r:'+t.r+';--sh:'+t.sh+';--pat:'+(t.cpat||t.pat)+';--sz:'+(t.csz||t.sz)+'">'+foto(p,false)+'<h2 style="font-family:'+t.f+','+(t.ff||'Verdana,sans-serif')+'">'+esc(p.nome)+'</h2><p>'+esc(p.apelido)+'</p></a>'}).join('')+'</div>';
}
function conteudo(p,t){
  if(aba==='ficha')return caixa(u('ficha'),p.ficha.length?'<dl class="ficha">'+p.ficha.map(f=>'<div><dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd></div>').join('')+'</dl>':'<p>'+u('noFicha')+'</p>');
  if(aba==='historia')return caixa(u('hist'),(p.aviso?'<p class="aviso">'+esc(p.aviso)+'</p>':'')+'<p class="texto">'+esc(p.historia)+'</p>')+caixa(u('grupo'),'<p class="texto">'+esc(p.grupo)+'</p>');
  if(aba==='sobre')return p.secoes.map(s=>caixa(s[0],'<p class="texto">'+esc(s[1])+'</p>')).join('')+caixa(u('cur'),'<ul class="lista">'+p.curiosidades.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
  if(aba==='rels')return caixa(u('rels'),'<ul class="rels">'+p.relacoes.map(r=>{const o=porId(r.com)||PERSONAGENS.find(x=>x.nome===r.com),n=o?o.nome:r.com;
    return '<li style="--cc:'+(o?o.cor:p.cor)+'"><div class="av" aria-hidden="true">'+esc(n.charAt(0))+'</div><div><b>'+(o?'<a href="#'+o.id+'">'+esc(n)+'</a>':esc(n))+'</b>'+(r.tag?'<span class="tag">'+esc(r.tag)+'</span>':'')+'<p>'+esc(r.texto)+'</p></div></li>'}).join('')+'</ul>');
  if(aba==='livro'){const L=gbLer(p.id);
    return caixa(u('livro'),'<p class="info">'+u('gb1')+esc(p.nome)+u('gb2')+'</p><label class="gl">'+u('gbN')+'<input id="gbn" maxlength="30"></label><label class="gl">'+u('gbM')+'<textarea id="gbm" rows="3" maxlength="300"></textarea></label><button class="bt" style="width:auto" type="button" data-assinar="'+p.id+'">'+u('sign')+'</button>')+
    (L.length?caixa(u('msgs'),'<ul class="gb">'+L.map(x=>'<li><b>'+esc(x.n)+'</b> <span class="info">'+esc(x.d)+'</span><br>'+esc(x.m)+'</li>').join('')+'</ul>'):'')}
  return '<section class="caixa">'+(t.onda?ONDA:'')+'<div class="hello" aria-hidden="true">'+(lang==='en'?(t.oiEn||'Hi!!'):(t.oi||'Oi!!'))+'</div><p>'+esc(p.oi||u('oiDef1')+p.nome+u('oiDef2'))+'</p><blockquote class="frase">'+esc(p.frase)+'</blockquote>'+orn(t.d)+'<p class="info">'+u('visitor')+' <span class="num">'+String(vis).padStart(4,'0')+'</span></p></section>'+
    caixa(u('likes'),chips(p.gostos))+caixa(p.tituloDesgostos,chips(p.desgostos));
}
function perfil(p,i){p=D(p);
  document.title=p.nome+' | '+u('site');
  const t=TEMAS[p.id],F=falasDe(p.id),ant=PERSONAGENS[(i+5)%6],prox=PERSONAGENS[(i+1)%6];
  const esq='<div class="esq"><div class="caixa"><figure class="polaroid">'+foto(p,true)+'</figure><h1 class="nomeh">'+esc(p.nome)+'</h1>'+orn(t.d)+'<p class="info"><b>'+u('full')+'</b> '+esc(p.apelido)+'<br><b>'+u('age')+'</b> '+esc(p.idade)+'<br><b>'+u('occ')+'</b> '+esc(p.ocupacao)+'</p>'+(imgs[p.id]?'<button class="rm" type="button" data-remover="'+p.id+'">'+u('rmImg')+'</button>':'')+'</div></div>';
  const dir='<div class="dir"><div class="caixa">'+orn(t.d)+'<div class="abas">'+ABAS.map(a=>'<button class="bt" type="button" data-aba="'+a[0]+'" aria-pressed="'+(a[0]===aba)+'">'+t.d+' '+u('t_'+a[0])+'</button>').join('')+'</div>'+orn(t.d)+'<button class="mascote" type="button" data-mascote aria-label="'+u('talk')+'">'+esc(t.mascote)+'</button><div class="fala" aria-live="polite">'+esc(F[fi%F.length])+'</div></div></div>';
  $('#app').innerHTML='<div class="tres">'+esq+'<div class="centro">'+conteudo(p,t)+'</div>'+dir+'</div><nav class="nav" aria-label="'+u('browse')+'"><a class="btn" href="#'+ant.id+'">'+u('prev')+esc(ant.nome)+'</a><a class="btn" href="#'+prox.id+'">'+u('next')+esc(prox.nome)+'</a></nav>';
}
function route(){
  const id=location.hash.slice(1),i=PERSONAGENS.findIndex(p=>p.id===id),k=i<0?'home':id;
  if(k!==pag){pag=k;aba='oi';fi=0}
  tema(k);estatico(k);
  if(i<0)home();else perfil(PERSONAGENS[i],i);
  const pill=(h,n,t,cur)=>'<a href="'+h+'" style="--k:'+t.c+';--kb:'+t.a+'"'+(cur?' aria-current="page"':'')+'>'+esc(n)+'</a>';
  $('#menu').innerHTML=pill('#inicio',u('home'),TEMAS.home,i<0)+PERSONAGENS.map(p=>pill('#'+p.id,p.nome,TEMAS[p.id],p.id===id)).join('');
}

function salvar(id,file){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.85);imgs[id]=u;
    try{localStorage.setItem('img:'+id,u)}catch(e){}
    route();
  };im.src=r.result};
  r.readAsDataURL(file);
}
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input[type=file][data-id]')&&t.files[0])salvar(t.dataset.id,t.files[0])});
document.addEventListener('click',e=>{const b=e.target.closest('[data-remover]');if(!b)return;const id=b.dataset.remover;delete imgs[id];try{localStorage.removeItem('img:'+id)}catch(x){}route()});
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-aba],[data-mascote],[data-assinar],[data-lang]');
  if(t&&t.hasAttribute('data-lang')){lang=lang==='en'?'pt':'en';try{localStorage.setItem('lang',lang)}catch(x){}route()}
  else if(t&&t.dataset.aba){aba=t.dataset.aba;route();if(matchMedia('(max-width:860px)').matches)document.querySelector('.centro').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})}
  else if(t&&t.hasAttribute('data-mascote')){const F=falasDe(pag);fi=(fi+1)%F.length;document.querySelector('.fala').textContent=F[fi]}
  else if(t&&t.dataset.assinar){const m=$('#gbm').value.trim();if(m){const L=gbLer(t.dataset.assinar);L.unshift({n:$('#gbn').value.trim()||u('anon'),m:m,d:new Date().toLocaleDateString(lang==='en'?'en-US':'pt-BR')});try{localStorage.setItem('gb:'+t.dataset.assinar,JSON.stringify(L.slice(0,30)))}catch(x){}route()}}
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const b=document.createElement('span');b.className='brilho';b.setAttribute('aria-hidden','true');const Q=TEMAS[pag]||TEMAS.home,K=Q.k||[Q.d];b.textContent=K[Math.floor(Math.random()*K.length)];b.style.left=e.clientX+'px';b.style.top=e.clientY+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),800)}
});
let vis=1;try{vis=(+localStorage.getItem('visitas')||0)+1;localStorage.setItem('visitas',vis)}catch(e){}
$('#visitas').textContent=String(vis).padStart(4,'0');
route();
</script>
</body>
</html>
